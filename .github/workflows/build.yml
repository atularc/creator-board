name: Build Windows installer

# Builds the installer from this source code on GitHub's own servers, runs the safety tests,
# writes a SHA-256 checksum, records a build provenance attestation, and (for version tags) publishes a Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # create the Release
  id-token: write        # build provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Safety tests
        run: npm test

      - name: Build the installer
        run: npm run dist

      - name: Checksum
        shell: pwsh
        run: |
          $f = Get-Item dist\Creator-Board-Setup.exe
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($f.Name)" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          "SHA-256: $h" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # --- Code signing goes HERE once a free signing certificate is approved (see docs/SIGNING.md).
      # --- Sign dist\Creator-Board-Setup.exe BEFORE the checksum and attestation steps, then move them after it.

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Creator-Board-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Creator-Board-Setup
          path: |
            dist/Creator-Board-Setup.exe
            dist/SHA256SUMS.txt

      - name: Publish the Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Creator-Board-Setup.exe dist/SHA256SUMS.txt --title "Creator Board ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --verify-tag
